upstream octane_app {
    server app:8000;
    keepalive 512;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;
    charset utf-8;
    # Se o arquivo existir fisicamente (estáticos), o Nginx entrega direto.
    # Se não, manda para o Octane.
    location / {
        try_files $uri $uri/ @octane;
    }

    location @octane {
        proxy_pass http://octane_app; # Usando o upstream definido acima
        # Essencial para o keepalive funcionar
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Headers para o Octane identificar o cliente real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ajustes de timeout para evitar 504 em requisições longas de stress
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    error_log  /var/log/nginx/error.log;
    access_log on; # Desative o access_log durante o benchmark para economizar I/O de disco
}
